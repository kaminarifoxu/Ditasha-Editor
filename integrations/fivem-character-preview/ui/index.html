<!doctype html><html lang="id"><head><meta charset="utf-8"><style>body{display:none;font:14px system-ui;background:#151b25;color:white;margin:16px}textarea{width:100%;height:200px;background:#202c3b;color:white;box-sizing:border-box;padding:12px}button{padding:12px;background:#d5b444;border:0;border-radius:8px;cursor:pointer}small{display:block;margin:12px 0}</style></head><body><h3>DITASHA — Preview Wajah Freemode</h3><small>Tempel JSON hasil ekspor Character Maker. Preview menggunakan engine GTA V asli. ESC untuk menutup.</small><textarea id="json" placeholder='{"model":"mp_f_freemode_01",...}'></textarea><button id="apply">Terapkan pada karakter saya</button><button id="close">Tutup</button><p id="status"></p><script>document.querySelector('#apply').onclick=async()=>{try{const body=JSON.parse(document.querySelector('#json').value);const r=await fetch('https://'+GetParentResourceName()+'/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.querySelector('#status').textContent=(await r.json()).message||'Diproses';}catch(e){document.querySelector('#status').textContent=e.message}};const close=()=>{document.body.style.display='none';return fetch('https://'+GetParentResourceName()+'/close',{method:'POST',body:'{}'})};window.addEventListener('message',e=>{if(e.data?.type==='open')document.body.style.display='block'});document.querySelector('#close').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});</script></body></html>
