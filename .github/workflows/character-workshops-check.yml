name: Verify Character Workshops
on:
  push:
    branches: [codex/full-ped-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build:ui
      - run: npx electron scripts/smoke-tools.cjs
        timeout-minutes: 6
      - run: npx electron scripts/smoke-character-workshops.cjs
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Character-Workshop-UI-QA
          path: release/qa/*
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify full ped rig with real Blender and Muto
        run: npx electron scripts/smoke-native-setup.cjs --character-only
