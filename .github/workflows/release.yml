name: Build Windows portable release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ganomabi-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check code formatting
        run: npm run format:check
      - name: Test application
        run: npm test
      - name: Build portable EXE
        run: npm run build:win
      - name: Verify differential reconstruction of actual EXE packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0) { throw 'Previous release metadata unavailable.' }
          $previousDir = Join-Path $env:RUNNER_TEMP 'ditasha-previous-installer'
          New-Item -ItemType Directory -Force $previousDir | Out-Null
          gh release download $previous --repo $env:GITHUB_REPOSITORY --pattern 'DITASHA-Setup.exe' --pattern 'DITASHA-Setup.exe.sha256' --dir $previousDir
          if ($LASTEXITCODE -ne 0) { throw 'Previous installer download failed.' }
          $env:DITASHA_PREVIOUS_SETUP = Join-Path $previousDir 'DITASHA-Setup.exe'
          $env:DITASHA_PREVIOUS_VERSION = $previous
          npx electron scripts/smoke-differential-electron.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Differential reconstruction failed.' }
        timeout-minutes: 8
      - name: Test GTA V viewers, explorer, archive tools and converter
        run: npx electron scripts/smoke-tools.cjs
        timeout-minutes: 5
      - name: Test Logo Prop Studio preview and exports
        run: npx electron scripts/smoke-logo-prop.cjs
        timeout-minutes: 4
      - name: Install and reinstall Windows Setup with preserved user data
        run: node scripts/smoke-setup.cjs
        timeout-minutes: 8
      - name: Test real embedded IDE engine
        shell: pwsh
        run: |
          node scripts/check-packaged-ide.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged engine files differ.' }
          $env:DITASHA_IDE_RUNTIME = Join-Path $env:GITHUB_WORKSPACE 'release/win-unpacked/resources/ide-runtime'
          npx electron scripts/smoke-embedded-ide.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Embedded IDE check failed.' }
      - name: Test real portable download and restart
        env:
          DITASHA_CI_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/smoke-portable-update.cjs
        timeout-minutes: 8
      - name: Generate SHA-256
        run: node scripts/checksum.cjs
      - name: Store build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DITASHA-Editor-Windows-x64
          path: |
            release/DITASHA-Editor.exe
            release/DITASHA-Setup.exe
            release/*.sha256
            release/*.blockmap
      - name: Store UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DITASHA-Editor-UI-QA
          path: |
            release/qa/*.png
            release/qa/*-result.json
      - name: Publish new version to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw 'Tag must match package.json version.'
          }
          $assets = @('release/DITASHA-Editor.exe', 'release/DITASHA-Editor.exe.sha256', 'release/DITASHA-Editor.exe.blockmap', 'release/DITASHA-Setup.exe', 'release/DITASHA-Setup.exe.sha256', 'release/DITASHA-Setup.exe.blockmap')
          foreach ($asset in $assets) { if (!(Test-Path $asset)) { throw "Missing release file: $asset" } }
          $isDraft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($isDraft -eq 'false') {
              Write-Host "Release $tag already exists; keeping its assets unchanged."
              exit 0
            }
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed.' }
          } else {
            gh release create $tag @assets --draft --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DITASHA Editor $version" --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          }
          gh release edit $tag --draft=false --latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
