name: Build Windows portable release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ganomabi-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check code formatting
        run: npm run format:check
      - name: Test application
        run: npm test
      - name: Build portable EXE
        run: npm run build:win
      - name: Test GTA V viewers, explorer, archive tools and converter
        run: npx electron scripts/smoke-tools.cjs
        timeout-minutes: 3
      - name: Test real portable download and restart
        run: node scripts/smoke-portable-update.cjs
        timeout-minutes: 8
      - name: Generate SHA-256
        run: node scripts/checksum.cjs
      - name: Store build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DITASHA-Editor-Windows-x64
          path: |
            release/DITASHA-Editor.exe
            release/*.sha256
      - name: Store UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DITASHA-Editor-UI-QA
          path: release/qa/*.png
      - name: Publish new version to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw 'Tag must match package.json version.'
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; keeping its assets unchanged."
            exit 0
          }
          $exe = "release/DITASHA-Editor.exe"
          gh release create $tag $exe "$exe.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DITASHA Editor $version" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
