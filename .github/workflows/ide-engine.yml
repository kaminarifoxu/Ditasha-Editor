name: Build embedded Code - OSS engine
on:
  workflow_dispatch:
  push:
    branches: [codex/embedded-code-oss]
jobs:
  engine:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: ditasha
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: a4d6dc1d9dc15c3c92f26e94c025a93699334fa5
          path: code-oss
      - uses: actions/setup-node@v4
        with:
          node-version-file: code-oss/.nvmrc
      - name: Configure MIT engine without Microsoft Marketplace bundles
        working-directory: code-oss
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs');
          const product = JSON.parse(fs.readFileSync('product.json', 'utf8'));
          product.builtInExtensions = [];
          product.nameShort = 'DITASHA Code - OSS';
          product.nameLong = 'DITASHA Code - OSS';
          product.applicationName = 'ditasha-code-oss';
          product.serverApplicationName = 'ditasha-code-oss-server';
          product.serverDataFolderName = '.ditasha-code-oss';
          delete product.extensionsGallery;
          delete product.defaultChatAgent;
          fs.writeFileSync('product.json', JSON.stringify(product, null, 2));
          '@ | node
      - name: Install native build dependencies
        working-directory: code-oss
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Compile complete Windows workbench and extension host
        working-directory: code-oss
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run gulp -- vscode-reh-web-win32-x64-min
      - name: Verify engine layout
        shell: pwsh
        run: |
          $root = 'vscode-reh-web-win32-x64'
          foreach ($file in @('node.exe', 'out/server-main.js', 'out/vs/code/browser/workbench/workbench.html', 'product.json')) {
            if (!(Test-Path (Join-Path $root $file))) { throw "Missing engine file: $file" }
          }
          & "$root/node.exe" "$root/out/server-main.js" --help
          if ($LASTEXITCODE -ne 0) { throw 'Engine failed to launch.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install DITASHA and run application checks
        working-directory: ditasha
        run: |
          npm ci
          npm test
          npm run build:ui
          npx electron scripts/smoke-tools.cjs
      - name: Test real embedded workbench in Windows
        working-directory: ditasha
        shell: pwsh
        run: |
          $env:DITASHA_IDE_RUNTIME = Join-Path $env:GITHUB_WORKSPACE 'vscode-reh-web-win32-x64'
          npx electron scripts/smoke-embedded-ide.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Embedded engine test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: DITASHA-Code-OSS-Windows-x64
          path: vscode-reh-web-win32-x64/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DITASHA-Embedded-IDE-QA
          path: ditasha/release/qa/*.png
