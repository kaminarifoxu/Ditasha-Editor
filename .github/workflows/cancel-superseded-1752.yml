name: Cancel superseded v1.75.2 build
on:
  push:
    branches: [codex/release-control-1752]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const target = 41110976732;
            const { data: run } = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: target});
            if (run.head_sha !== 'e5c04cf3797257d652c887bcb67c446cef85e617') throw new Error('Unexpected release commit');
            if (run.status === 'completed') throw new Error('Release already completed; do not cancel');
            await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: target});
            core.info('Cancelled obsolete build before publishing the final checkpoint fix.');
