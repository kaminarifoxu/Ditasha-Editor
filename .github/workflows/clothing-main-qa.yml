name: Clothing Library main integration QA and formatting
on:
  push:
    paths:
      - '.github/workflows/clothing-main-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only changed Clothing Library integration files
        run: npx prettier --write electron/clothing-library.cjs electron/clothing-ipc.cjs electron/main.cjs electron/preload.cjs src/file-manager-ui.js tests/file-manager-clothing-fallback.test.cjs
      - name: Keep main source formatting consistent
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/clothing-library.cjs electron/clothing-ipc.cjs electron/main.cjs electron/preload.cjs src/file-manager-ui.js tests/file-manager-clothing-fallback.test.cjs
          if (git diff --cached --quiet) { Write-Host "No formatting changes" } else { git commit -m "style(clothing): format main integration without UI changes"; git push origin HEAD:main }
      - run: npm run format:check
      - run: npm test
      - run: npm run build:ui
